<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic Photo Editor & Gallery</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #222; color: #eee; }
  header { padding: 10px 16px; background: #111; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 auto 0 0; }
  button, label.btn { background: #444; color: #fff; border: 0; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:hover, label.btn:hover { background: #666; }
  main { padding: 16px; }
  .hidden { display: none; }
  #editor canvas { max-width: 100%; background: #000; display: block; margin-bottom: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; }
  .controls label { display: flex; flex-direction: column; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .item { background: #333; padding: 6px; border-radius: 4px; }
  .item img { width: 100%; height: 130px; object-fit: cover; display: block; cursor: pointer; }
  .item .row { margin-top: 6px; }
  .empty { color: #999; }
</style>
</head>
<body>
<header>
  <h1>Photo Editor &amp; Gallery</h1>
  <button id="tabEditor">Editor</button>
  <button id="tabGallery">Gallery</button>
  <button id="logout" class="hidden">Log out</button>
</header>

<main>
  <section id="login" class="hidden">
    <h2>Log in or create an account</h2>
    <div class="controls">
      <label>Username <input id="user" autocomplete="username"></label>
      <label>Password <input id="pass" type="password" autocomplete="current-password"></label>
    </div>
    <div class="row"><button id="doLogin">Log in</button><button id="doRegister">Create account</button></div>
    <p id="loginMsg" class="empty"></p>
  </section>

  <section id="editor" class="hidden">
    <div class="row" style="margin-bottom:12px">
      <label class="btn">Open photo<input id="file" type="file" accept="image/*" hidden></label>
      <label class="btn">Upload photos to gallery<input id="bulk" type="file" accept="image/*" multiple hidden></label>
    </div>
    <canvas id="canvas" width="600" height="400"></canvas>
    <div class="controls">
      <label>Brightness <input id="brightness" type="range" min="0" max="200" value="100"></label>
      <label>Contrast <input id="contrast" type="range" min="0" max="200" value="100"></label>
      <label>Saturation <input id="saturate" type="range" min="0" max="200" value="100"></label>
      <label>Grayscale <input id="grayscale" type="range" min="0" max="100" value="0"></label>
      <label>Blur <input id="blur" type="range" min="0" max="10" value="0"></label>
    </div>
    <div class="row">
      <button id="rotate">Rotate 90°</button>
      <button id="flip">Flip</button>
      <button id="reset">Reset</button>
      <button id="save">Save to gallery</button>
      <button id="download">Download</button>
    </div>
  </section>

  <section id="gallery" class="hidden">
    <div id="grid"></div>
    <p id="empty" class="empty hidden">No photos yet. Upload some or edit one and click "Save to gallery".</p>
  </section>
</main>

<script>
// ---------- Server API ----------
let token = localStorage.getItem('token');
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } });
  if (res.status === 401) { logout(); throw new Error('Not logged in'); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Request failed');
  return res;
}
const upload = blob => api('/api/photos', { method: 'POST', headers: { 'Content-Type': blob.type }, body: blob });

// ---------- Editor ----------
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
let img = null, rotation = 0, flipped = false;
const sliders = ['brightness', 'contrast', 'saturate', 'grayscale', 'blur'];

function filterString() {
  return `brightness(${$('brightness').value}%) contrast(${$('contrast').value}%) ` +
         `saturate(${$('saturate').value}%) grayscale(${$('grayscale').value}%) blur(${$('blur').value}px)`;
}

function draw() {
  if (!img) return;
  const swap = rotation % 180 !== 0;
  canvas.width = swap ? img.height : img.width;
  canvas.height = swap ? img.width : img.height;
  ctx.filter = filterString();
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rotation * Math.PI / 180);
  if (flipped) ctx.scale(-1, 1);
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
}

function resetAll() {
  rotation = 0; flipped = false;
  $('brightness').value = $('contrast').value = $('saturate').value = 100;
  $('grayscale').value = $('blur').value = 0;
  draw();
}

$('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const i = new Image();
  i.onload = () => { img = i; resetAll(); };
  i.src = URL.createObjectURL(f);
};
sliders.forEach(s => $(s).oninput = draw);
$('rotate').onclick = () => { rotation = (rotation + 90) % 360; draw(); };
$('flip').onclick = () => { flipped = !flipped; draw(); };
$('reset').onclick = resetAll;

$('download').onclick = () => {
  if (!img) return alert('Open a photo first.');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'edited.png';
  a.click();
};

$('save').onclick = () => {
  if (!img) return alert('Open a photo first.');
  canvas.toBlob(async blob => {
    try { await upload(blob); alert('Saved to gallery!'); } catch (e) { alert(e.message); }
  }, 'image/png');
};

// ---------- Gallery view ----------
async function renderGallery() {
  const grid = $('grid');
  let photos;
  try { photos = await (await api('/api/photos')).json(); } catch (e) { return; }
  grid.innerHTML = '';
  $('empty').classList.toggle('hidden', photos.length > 0);
  for (const p of photos) {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<img alt="photo"><div class="row"><button>Edit</button><button>Download</button><button>Delete</button></div>';
    grid.appendChild(div);
    const imgEl = div.querySelector('img');
    const [edit, dl, del] = div.querySelectorAll('button');
    api('/api/photos/' + p.id).then(r => r.blob()).then(blob => {
      const url = URL.createObjectURL(blob);
      imgEl.src = url;
      edit.onclick = () => { const i = new Image(); i.onload = () => { img = i; resetAll(); show('editor'); }; i.src = url; };
      dl.onclick = () => { const a = document.createElement('a'); a.href = url; a.download = p.id; a.click(); };
    });
    del.onclick = async () => { if (confirm('Delete this photo?')) { await api('/api/photos/' + p.id, { method: 'DELETE' }); renderGallery(); } };
  }
}

function show(tab) {
  for (const t of ['login', 'editor', 'gallery']) $(t).classList.toggle('hidden', t !== tab);
  if (tab === 'gallery') renderGallery();
}
function logout() {
  token = null; localStorage.removeItem('token');
  $('logout').classList.add('hidden'); $('tabEditor').classList.add('hidden'); $('tabGallery').classList.add('hidden');
  show('login');
}
function loggedIn(t) {
  token = t; localStorage.setItem('token', t);
  ['logout', 'tabEditor', 'tabGallery'].forEach(id => $(id).classList.remove('hidden'));
  show('gallery');
}
async function auth(kind) {
  const res = await fetch('/api/' + kind, { method: 'POST', body: JSON.stringify({ username: $('user').value, password: $('pass').value }) });
  const data = await res.json();
  if (res.ok) { $('loginMsg').textContent = ''; loggedIn(data.token); } else $('loginMsg').textContent = data.error;
}
$('doLogin').onclick = () => auth('login');
$('doRegister').onclick = () => auth('register');
$('logout').onclick = async () => { try { await api('/api/logout', { method: 'POST' }); } catch {} logout(); };
$('tabEditor').onclick = () => show('editor');
$('tabGallery').onclick = () => show('gallery');

$('bulk').onchange = async e => {
  let n = 0;
  for (const f of e.target.files) { try { await upload(f); n++; } catch (err) { alert(f.name + ': ' + err.message); } }
  e.target.value = '';
  alert(n + ' photo(s) uploaded.');
  show('gallery');
};

if (token) loggedIn(token); else logout();
</script>
</body>
</html>
